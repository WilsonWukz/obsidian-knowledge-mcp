name: Deploy Obsidian Cloud (manual)

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: "Cloudflare Account ID (32 hex chars; not a password)"
        type: string
        required: true
      bucket_name:
        description: "New private test R2 bucket (must include test)"
        type: string
        required: true
        default: wilson-obsidian-mcp-test
      public_origin:
        description: "Verified public Worker origin; exact-diff browser review links"
        type: string
        required: true
        default: https://obsidian-knowledge-mcp.wilsonkwu.workers.dev
      enable_reviewed_writes:
        description: "Enable independently approved writes only to INSES/ (default disabled)"
        type: boolean
        required: true
        default: false
      enable_guarded_sync_api:
        description: "Enable isolated owner-authenticated sync API (no live Vault cutover)"
        type: boolean
        required: true
        default: false
      enable_sync_adoption:
        description: "Temporarily allow owner-confirmed legacy baseline adoption"
        type: boolean
        required: true
        default: false
      enable_guarded_sync_cutover:
        description: "Switch managed INSES reads/writes to versioned HEAD (after revocation)"
        type: boolean
        required: true
        default: false
      legacy_writers_revoked:
        description: "I have revoked direct R2/S3 writers and disabled Remotely Save on INSES/"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: obsidian-cloudflare-bootstrap
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision R2 + KV and deploy safely gated Worker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Run synthetic tests before cloud mutations
        run: |
          set -euo pipefail
          npm test
          node --experimental-strip-types --test test-node/*.node.mjs
          node --experimental-strip-types --test clients/obsidian-guarded-sync/tests/*.cjs
          node clients/obsidian-guarded-sync/scripts/build.mjs
          npx wrangler types --config wrangler.test.jsonc
          npx tsc --noEmit

      - name: Validate inputs without storing secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: "${{ inputs.account_id }}"
          R2_BUCKET_NAME: "${{ inputs.bucket_name }}"
          WORKER_PUBLIC_ORIGIN: "${{ inputs.public_origin }}"
          ENABLE_REVIEWED_WRITES: "${{ inputs.enable_reviewed_writes }}"
          ENABLE_GUARDED_SYNC_API: "${{ inputs.enable_guarded_sync_api }}"
          ENABLE_SYNC_ADOPTION: "${{ inputs.enable_sync_adoption }}"
          GUARDED_SYNC_CUTOVER: "${{ inputs.enable_guarded_sync_cutover }}"
          LEGACY_WRITERS_REVOKED: "${{ inputs.legacy_writers_revoked }}"
          OBSIDIAN_SYNC_OWNER_TOKEN: "${{ secrets.OBSIDIAN_SYNC_OWNER_TOKEN }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          OBSIDIAN_MCP_AUTH_PASSWORD: "${{ secrets.OBSIDIAN_MCP_AUTH_PASSWORD }}"
        run: node scripts/ci-bootstrap.mjs

      - name: Provision or reuse private Cloudflare R2 and OAuth KV
        env:
          CLOUDFLARE_ACCOUNT_ID: "${{ inputs.account_id }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
        run: npm run setup

      - name: Deploy OAuth-protected Worker (reviewed writes default off)
        env:
          CLOUDFLARE_ACCOUNT_ID: "${{ inputs.account_id }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc 2>&1 | tee deploy.log
          WORKER_URL="$(grep -Eo 'https://[[:alnum:]._-]+\.workers\.dev' deploy.log | head -n 1 || true)"
          if [ -z "$WORKER_URL" ]; then
            echo "Worker deployed, but no workers.dev URL found in Wrangler output"
            echo "Inspect Cloudflare Workers & Pages dashboard before assuming readiness"
            exit 1
          fi
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"

      - name: Set OAuth login password as a Cloudflare Worker secret
        env:
          CLOUDFLARE_ACCOUNT_ID: "${{ inputs.account_id }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          MCP_LOGIN_PASSWORD: "${{ secrets.OBSIDIAN_MCP_AUTH_PASSWORD }}"
        run: |
          set -euo pipefail
          test -n "$MCP_LOGIN_PASSWORD"
          printf '%s' "$MCP_LOGIN_PASSWORD" | npx wrangler secret put AUTH_PASSWORD --config wrangler.jsonc

      - name: Install private owner sync token (only when API is enabled)
        if: inputs.enable_guarded_sync_api
        env:
          CLOUDFLARE_ACCOUNT_ID: "${{ inputs.account_id }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          OWNER_SYNC_TOKEN: "${{ secrets.OBSIDIAN_SYNC_OWNER_TOKEN }}"
        run: |
          set -euo pipefail
          test "${#OWNER_SYNC_TOKEN}" -ge 32
          printf '%s' "$OWNER_SYNC_TOKEN" | npx wrangler secret put SYNC_OWNER_TOKEN --config wrangler.jsonc

      - name: Verify browser password form reached without any real approval
        if: inputs.enable_reviewed_writes
        run: |
          set -euo pipefail
          node scripts/smoke-review-form.mjs "$WORKER_URL"
      - name: Verify live Worker without accessing private vault data
        env:
          R2_BUCKET_NAME: "${{ inputs.bucket_name }}"
          ENABLE_REVIEWED_WRITES: "${{ inputs.enable_reviewed_writes }}"
          ENABLE_GUARDED_SYNC_API: "${{ inputs.enable_guarded_sync_api }}"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --max-time 15 "$WORKER_URL/health" > health.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const body = JSON.parse(readFileSync("health.json", "utf8"));
            const expected = process.env.ENABLE_REVIEWED_WRITES === "true";
            if (body.ok !== true || body.version !== "0.3.1" ||
                body.reviewed_writes_enabled !== expected ||
                body.guarded_sync_api_enabled !== (process.env.ENABLE_GUARDED_SYNC_API === "true"))
              throw Error("Worker version or reviewed-write safety mode disagrees with workflow input");
            console.log("Public health check successful, version:", body.version,
              "reviewed writes:", body.reviewed_writes_enabled);
          '
          {
            echo "### Obsidian Knowledge MCP deployed"
            echo ""
            echo "Worker health: $WORKER_URL/health"
            echo ""
            echo "MCP endpoint: $WORKER_URL/mcp"
            echo ""
            echo "R2 bucket: $R2_BUCKET_NAME"
            echo ""
            echo "Reviewed writes enabled: $ENABLE_REVIEWED_WRITES"
            echo ""
            echo "**NEXT:** configure a separate synthetic test Obsidian vault with Remotely Save."
          } >> "$GITHUB_STEP_SUMMARY"
